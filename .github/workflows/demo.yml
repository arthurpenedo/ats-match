name: Demo

# Monta a demo estática (Streamlit rodando no navegador via stlite), abre num Chromium de verdade,
# confere que a nota calculada no navegador bate com a do Python e publica no GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - name: Montar o site
        run: python scripts/build_web.py site
      - name: Teste no navegador
        run: |
          python -m http.server -d site 8000 &
          sleep 1
          python scripts/e2e_web.py http://localhost:8000/ captura.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: |
            site
            captura.png
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
